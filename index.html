function t(k){ const v=LANG[curLang][k]; return v===undefined?k:v; }
function levelLabel(key){ return LANG[curLang].legend[key] || key; }

// 국가쌍 자신의 최근 히스토리 대비 Z-score로 백엔드(pipeline.py `_relative_level`)가 이미
// 계산해 둔 경보 수준(crit/high/elev/mod/low)을 우선 사용한다. 고정 절대 임계값(v>2=위급)은
// 백엔드 값이 없을 때(구버전 데이터, 표본 부족으로 backend가 null 반환, 또는 field 없이
// 호출되는 평균값 같은 합성 지표)에 한해 대략적인 표시용 폴백으로만 사용한다.
function _rcFallbackLevel(v){
  if(v===null||v===undefined)return null;
  if(v>2) return 'crit';
  if(v>1) return 'high';
  if(v>0.5)return 'elev';
  if(v>-0.5)return 'mod';
  return 'low';
}
const LEVEL_COLORS={
  crit:{c:'#ef4444',b:'rgba(239,68,68,.15)'},
  high:{c:'#f97316',b:'rgba(249,115,22,.15)'},
  elev:{c:'#eab308',b:'rgba(234,179,8,.12)'},
  mod: {c:'#06b6d4',b:'rgba(6,182,212,.12)'},
  low: {c:'#3b82f6',b:'rgba(59,130,246,.12)'}
};
function rc(v,field,domainKey){
  if(v===null||v===undefined)return{l:'N/A',c:'#1e3a6a',b:'rgba(30,58,106,.15)'};
  let level=null;
  if(field){
    const dom=(DATA.domains&&DATA.domains[domainKey||curDomain])||null;
    const backendLevel=(dom&&dom.level)?dom.level[field]:(DATA.level?DATA.level[field]:undefined);
    if(backendLevel!==undefined&&backendLevel!==null)level=backendLevel;
  }
  if(!level)level=_rcFallbackLevel(v);
  const colors=LEVEL_COLORS[level]||LEVEL_COLORS.low;
  return{l:level,c:colors.c,b:colors.b};
}
const fmt=v=>(v===null||v===undefined)?'N/A':(v>=0?'+':'')+parseFloat(v).toFixed(2);
const pct=v=>Math.min(Math.max((parseFloat(v)+3)/6,0),1)*100;

// 3일 전 대비 추세(상승/하락/평행) 계산 — 카드에서 클릭 없이 바로 "지금 심해지는 중인지"를 보여주기 위함
function computeTrend(field){
  const series=(DATA.series||{})[field];
  if(!series||series.length<2)return null;
  const now=series[series.length-1];
  if(now===null||now===undefined)return null;
  // 정확히 3일 전이 결측이면, 그보다 더 과거(최대 7일 전까지)에서 가장 가까운 유효값을 사용
  let past=null;
  const wantIdx=series.length-1-3;
  for(let i=Math.max(0,wantIdx);i>=Math.max(0,series.length-8);i--){
    if(series[i]!==null&&series[i]!==undefined){past=series[i];break;}
  }
  if(past===null)return null;
  const delta=now-past;
  if(delta>0.3)return{arrow:'▲',color:'#ef4444',delta};
  if(delta<-0.3)return{arrow:'▼',color:'#3b82f6',delta};
  return{arrow:'→',color:'#94a3b8',delta};
}

function renderSources(p){
  const box=document.getElementById('dsources');
  if(!box)return;
  const topArts=(DATA.top_articles && DATA.top_articles[curDomain])||{};
  let html='';
  ['threat','response'].forEach(dir=>{
    if(curDomain==='cyber')return; // 사이버는 방향 구분이 없어 근거기사 매핑 제외
    const dom=(DATA.domains && DATA.domains[curDomain])||{current:{}};
    const cur=parseFloat(dom.current[p+'_'+dir]||0);
    const level=rc(cur,p+'_'+dir,curDomain).l;
    if(!['crit','high','elev'].includes(level))return;
    const arts=topArts[p+'_'+dir]||[];
    const dirLabel=dir==='threat'?`${curLang==='ko'?META[p].name:META[p].name_en}→${curLang==='ko'?'한국':'Korea'}`:`${curLang==='ko'?'한국':'Korea'}→${curLang==='ko'?META[p].name:META[p].name_en}`;
    html+=`<div style="margin-top:.6rem;padding-top:.5rem;border-top:1px solid #0f2040">
      <div style="font-size:.72rem;color:#94a3b8;margin-bottom:.35rem">⚠ ${dirLabel} · ${levelLabel(level)} — ${t('sourcesTitle')}</div>`;
    if(!arts.length){
      html+=`<div style="font-size:.72rem;color:#5a6a8a;font-style:italic">${t('noSourcesExplain')}</div>`;
    }
    arts.forEach(a=>{
      const label=a.title||`${a.actor1} → ${a.actor2} (code ${a.event_code||''}, G${a.goldstein>=0?'+':''}${a.goldstein})`;
      const da=a.days_ago;
      const daysAgoText = (da===0) ? t('daysAgoToday') : (curLang==='ko' ? `${da}일 전` : `${da}d ago`);
      html+=`<div style="font-size:.72rem;margin-bottom:.3rem;line-height:1.4">
        <a href="${a.url}" target="_blank" rel="noopener" style="color:#38bdf8;text-decoration:underline">${label}</a>
        <span style="color:#5a6a8a"> (${daysAgoText})</span>
      </div>`;
    });
    html+=`</div>`;
  });
  box.innerHTML=html;
}

function renderOverall(){
  const threats=PARTNERS.map(p=>parseFloat(DATA.current[p+'_threat']||0));
  const avg=threats.reduce((a,b)=>a+b,0)/threats.length;
  const r=rc(avg);
  const qd=DATA.query_date||'';
  return `<div class="ov" id="ov">
    <div><div class="ov-l">${t('overallLabel')} · ${qd}</div><div class="ov-v" style="color:${r.c}">${fmt(avg)}</div></div>
    <div class="ov-bw">
      <div class="btrack"><div class="bfill" style="width:${pct(avg).toFixed(1)}%;background:${r.c}"></div></div>
      <div class="br"><span>${t('coop')}</span><span>0</span><span>${t('conf')}</span></div>
    </div>
    <div class="opill" style="background:${r.b};color:${r.c};border:1px solid ${r.c}44">${levelLabel(r.l)}</div>
  </div>`;
}

// 파이프라인(build_commentary)이 지수와 그 지수를 움직인 기사만을 근거로 생성한 짧은 해설.
// kbti_output.json에 commentary가 없으면(생성 실패·근거기사 부족·구버전 데이터) 아무것도 그리지 않는다.
function renderCommentary(){
  const c=DATA && DATA.commentary;
  if(!c)return '';
  const text=(curLang==='en'?c.en:c.ko)||'';
  if(!text)return '';
  const esc=x=>String(x).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const links=(c.sources||[]).map(x=>
    `<a href="${esc(x.url)}" target="_blank" rel="noopener">&middot; ${esc(x.title||x.url)}</a>`).join('');
  return `<div class="commentary">
    <h3>${t('commentaryTitle')}<span class="badge">${t('commentaryBadge')} &middot; ${esc(c.model||'')}</span></h3>
    <p>${esc(text).replace(/\n/g,'<br>')}</p>
    ${links?`<div class="sources"><div class="src-label">${t('commentarySources')}</div>${links}</div>`:''}
  </div>`;
}

    const dirHTML=curView==='both'?`

        <div class="dir-item">
          <div class="dir-label">▲ THREAT (${p}→${korWord})</div>
          <div class="dir-val" style="color:${rc(th,p+'_threat','overall').c}">${fmt(th)}</div>
        </div>
        <div style="width:1px;background:#0f2040"></div>

          <div class="dir-label">▼ RESPONSE (${korWord}→${p})</div>

    html+=`<div class="card" id="c-${p}" style="border-color:${r.c}44" onclick="show('${p}')">

        </div>
      </div>
      <div class="spark"><canvas id="s-${p}"></canvas></div>
      ${dirHTML}
      <div class="cf2"><span>${t('indexLbl')}: <strong style="color:${r.c}">${fmt(cur)}</strong></span><span>${t('clickDetails')}</span></div>
    </div>`;
  });
  html+='</div>';
  existing.innerHTML=html;

  PARTNERS.forEach(p=>{
    const th=parseFloat(DATA.current[p+'_threat']||0);
    const key=curView==='response'?p+'_response':p+'_threat';

  if(!wasOpen)openOverlay(); // 이미 열려있는 상태에서 다른 카드로 바꾸는 건 히스토리를 또 쌓지 않음
};

// 카드 하이라이트 갱신 + 차트 렌더링만 수행 (오버레이는 안 엶) — 초기 로드 시 사용
function prepareDetail(p){
  if(ak){const prev=document.getElementById('c-'+ak);if(prev){prev.style.borderColor=rc(parseFloat(DATA.current[ak+'_threat']||0),ak+'_threat','overall').c+'44';prev.style.background='#0a1628'}}
  ak=p;
  const card=document.getElementById('c-'+p);
  const th0=parseFloat(DATA.current[p+'_threat']||0);
  const r0=rc(th0,p+'_threat','overall');
  if(card){card.style.borderColor=r0.c+'99';card.style.background='#0d1e38'}
  renderDomainTabs();
  renderRangeTabs();
  renderDetailChart(p);
}

function openOverlay(){
  const ov=document.getElementById('det-overlay');
  if(ov)ov.classList.add('open');
  document.body.style.overflow='hidden';
  window.scrollTo(0,0);
  // 히스토리에 한 단계 쌓아서, 브라우저/기기의 "뒤로가기"를 누르면 이 상태가 소비되며
  // popstate 이벤트가 발생 -> 아래 리스너가 오버레이를 자동으로 닫음
  history.pushState({kbtiDetail:true}, '', location.href);
}

function hideOverlayUI(){
  const ov=document.getElementById('det-overlay');
  if(ov)ov.classList.remove('open');
  document.body.style.overflow='';
}

// "목록으로 돌아가기" 버튼: 직접 숨기지 않고 history.back()을 호출해서
// 뒤로가기 버튼을 눌렀을 때와 완전히 동일한 경로(popstate)로 처리 -> 히스토리 스택이 꼬이지 않음
window.closeDetail=function(){
  if(history.state && history.state.kbtiDetail)history.back();
  else hideOverlayUI();
};

window.addEventListener('popstate', function(){
  hideOverlayUI();
});

// full_dates(YYYY-MM-DD)를 x축 라벨로 사용 — 항상 날짜가 보이도록
function renderDetailChart(p){
  const dtEl=document.getElementById('dt');
  const dnoteEl=document.getElementById('dnote');
  const dcEl=document.getElementById('dc');
  if(!dcEl)return;
  const xLabels = DATA.full_dates || DATA.dates;
  const pairName=curLang==='ko'?META[p].ko:META[p].en;

  if(curDomain==='cyber'){
    const cyber = (DATA.domains && DATA.domains.cyber) || {series:{},current:{}};
    const vals=(cyber.series[p]||[]).map(v=>v===null?null:parseFloat(v));
    const cur=parseFloat(cyber.current[p]||0);
    const r=rc(cur);
    if(dtEl) dtEl.innerHTML=`${pairName} · ${t('domainNames').cyber} (GKG CYBER_ATTACK) &nbsp;<span style="color:${r.c}">${t('indexLbl')} ${fmt(cur)}</span>`;
    if(dnoteEl) dnoteEl.textContent=t('domainNotes').cyber;
    if(dc)dc.destroy();
    dc=new Chart(dcEl,{
      type:'line',
      data:{labels:xLabels,datasets:[
        {label:'Cyber Tension ('+p+')',data:vals,borderColor:r.c,backgroundColor:r.c+'18',
          borderWidth:2,pointRadius:2.5,pointHoverRadius:5,pointBackgroundColor:r.c,
          tension:0,fill:true,spanGaps:false},
        {label:t('baseline'),data:Array(xLabels.length).fill(0),
          borderColor:'#0f2040',borderWidth:1,borderDash:[3,3],pointRadius:0,fill:false}
      ]},
      options: chartOptions(t('cyberYAxisLabel'))
    });
    renderSources(p);
    return;
  }

  const dom = (DATA.domains && DATA.domains[curDomain]) || {series:{},current:{}};
  const th=parseFloat(dom.current[p+'_threat']||0);
  const re=parseFloat(dom.current[p+'_response']||0);
  const rTh=rc(th,p+'_threat',curDomain);
  const rRe=rc(re,p+'_response',curDomain);
  const r=rTh;
  if(dtEl) dtEl.innerHTML=`${pairName} · ${t('domainNames')[curDomain]} &nbsp;<span style="color:${rTh.c}">▲ Threat ${fmt(th)}</span> &nbsp;<span style="color:${rRe.c}">▼ Response ${fmt(re)}</span>`;

  curPartner = p;
  let xLabelsForChart=xLabels, vals, valsRe, rangeNote='';
  if(curDomain==='overall'){
    const rs=getRangeSeries(p);
    xLabelsForChart=rs.labels.length?rs.labels:xLabels;
    vals=rs.labels.length?rs.threat:(dom.series[p+'_threat']||[]).map(v=>v===null?null:parseFloat(v));
    valsRe=rs.labels.length?rs.response:(dom.series[p+'_response']||[]).map(v=>v===null?null:parseFloat(v));
    rangeNote = rs.note || '';      // 기간 안내문. 아래에서 계열 설명 뒤에 붙인다.
  } else {
    vals=(dom.series[p+'_threat']||[]).map(v=>v===null?null:parseFloat(v));
    valsRe=(dom.series[p+'_response']||[]).map(v=>v===null?null:parseFloat(v));
  }
  if(dc)dc.destroy();
  const korWord=curLang==='ko'?'한국':'Korea';
  dc=new Chart(dcEl,{
    type:'line',
    data:{labels:xLabelsForChart,datasets:buildDatasets(p, korWord, r, vals, valsRe, xLabelsForChart)},
    options: chartOptions(t('yAxisLabel'), xLabelsForChart)
  });
  // 어느 계열을 그렸는지 반드시 밝힌다. 라벨에서 'LLM' 을 뺐으므로
  // 여기 없으면 화면 어디에도 출처가 없다.
  if(dnoteEl){
    const span = llmSpan ? ` (${llmSpan.lo} ~ ${llmSpan.hi}, ${llmSpan.n}/${llmSpan.of}일)` : '';
    const src = curLang==='ko'
      ? (usingLlm ? '선: LLM 전수코딩' + span
                  : '선: GDELT + LLM 감사 — 이 구간은 LLM 전수코딩 범위 밖입니다')
      : (usingLlm ? 'Series: LLM full coding' + span
                  : 'Series: GDELT + LLM audit — outside the LLM full-coding window');
    // 계열이 바뀌면 설명도 통째로 바꾼다. 앞에 덧붙이기만 하면 GDELT 집계
    // 규칙을 말하는 문장이 LLM 선 밑에 그대로 남아 서로 어긋난다.
    const notes = usingLlm ? t('llmDomainNotes') : t('domainNotes');
    dnoteEl.textContent = [src, notes[curDomain] || '', rangeNote].filter(Boolean).join('  ');
  }
  showDay(null);                       // 탭을 바꾸면 패널을 가장 최근 날짜로 되돌린다
  renderSources(p);
}

// 그래프는 **LLM 전수코딩만** 그린다. 감사 계열(GDELT+LLM 감사)은 빼기로 했다 —
// 두 계열이 겹쳐 있으면 툴팁에 지수가 넷이 뜨고, 오른쪽 해설은 한쪽만 설명해
// 어느 선을 읽는 것인지 알 수 없었다.
//
// 다만 **LLM 값이 없으면 감사로 되돌아간다.** 사이버 탭은 LLM 코딩 대상이
// 아니고, 과거 구간도 코딩이 안 된 날이 있을 수 있다. 빈 그래프를 보여주느니
// 있는 것을 그리고 어느 계열인지 밝힌다.
function buildDatasets(p, korWord, r, vals, valsRe, labels){
  const base={label:t('baseline'),data:Array(labels.length).fill(0),
    borderColor:'#0f2040',borderWidth:1,borderDash:[3,3],pointRadius:0,fill:false};
  const llm=llmDatasets(p, curDomain, labels);

  // **구간이 LLM 코딩 범위를 벗어나면 감사 계열로 되돌아간다.**
  // 전수코딩은 논문 창(41일)만 있다. 3개월·6개월을 고르면 앞쪽 절반 이상이
  // 빈 채로 그려져, 자료가 없는 것인지 긴장이 0이었던 것인지 알 수 없다.
  llmSpan = null;
  if(llm.length){
    const d=llm[0].data;
    let n=0, lo=null, hi=null;
    for(let i=0;i<d.length;i++){
      if(d[i]!==null && d[i]!==undefined){ n++; if(lo===null) lo=labels[i]; hi=labels[i]; }
    }
    // 문턱 0.9. 0.5 로 두었더니 3개월 구간이 43/75 로 통과해 앞 32일이
    // 빈 채로 그려졌다 — 자료가 없는 것인지 긴장이 0이었는지 알 수 없다.
    if(n && n/labels.length >= 0.9){ llmSpan={lo:lo,hi:hi,n:n,of:labels.length}; }
    else { llmSpan=null; llm.length=0; }
  }
  usingLlm = llm.length>0;
  if(usingLlm) return llm.concat([base]);
  return [
    {label:'Threat ('+p+'→'+korWord+')',data:vals,borderColor:r.c,backgroundColor:r.c+'18',
      borderWidth:2,pointRadius:2.5,pointHoverRadius:5,pointBackgroundColor:r.c,
      tension:0,fill:true,spanGaps:false},
    {label:'Response ('+korWord+'→'+p+')',data:valsRe,borderColor:'#c084fc',backgroundColor:'#c084fc18',
      borderWidth:1.5,pointRadius:2,pointHoverRadius:4,pointBackgroundColor:'#c084fc',
      tension:0,fill:false,spanGaps:false},
    base
  ];
}

// 두 방향의 LLM 선을 만든다. 값이 없는 방향은 건너뛴다.
// 감사 계열을 걷어낸 뒤로 이것이 **주 계열**이므로 실선으로 그린다. 점선은
// 보조 계열이라는 뜻이었다. 라벨에는 'LLM' 을 붙이지 않는다 — 툴팁에 지수
// 둘만 깔끔히 보이게 하는 것이 요점이고, 출처는 그래프 아래 주석에 적는다.
function llmDatasets(p, domain, labels){
  const out=[];
  const korWord=curLang==='ko'?'한국':'Korea';
  const th = llmValues(p,'threat',domain,labels);
  const re = llmValues(p,'response',domain,labels);
  if(th) out.push({label:'Threat ('+p+'→'+korWord+')',data:th,borderColor:'#f87171',
    backgroundColor:'#f8717118',borderWidth:2,pointRadius:2.5,pointHoverRadius:5,
    pointBackgroundColor:'#f87171',tension:0,fill:true,spanGaps:false});
  if(re) out.push({label:'Response ('+korWord+'→'+p+')',data:re,borderColor:'#38bdf8',
    borderWidth:1.5,pointRadius:2,pointHoverRadius:4,
    pointBackgroundColor:'#38bdf8',tension:0,fill:false,spanGaps:false});
  return out;
}

// 라벨(YYYY-MM-DD) 배열에 맞춰 LLM 계열 값을 꺼낸다. 값이 하나도 없으면 null 을
// 돌려주어 호출부가 선 자체를 그리지 않게 한다.
function llmValues(p, dir, domain, labels){
  if(!LLM) return null;
  if(domain==='cyber') return null;           // 사이버는 LLM 코딩 대상이 아니다
  const key = p+'_'+dir;
  const ch = LLM_CHANNEL[domain];
  // 세 경우를 구분한다.
  //   코딩하지 않은 날            -> null  (선을 끊는다. '측정 안 함'이다)
  //   코딩했고 이 칸에 증거 없음   -> 0     (긴장도 협력도 아니다)
  //   채널 자체를 계산하지 않은 날 -> null  (build_channels 도입 전 기록)
  // 0 으로 두는 근거: Goldstein 은 0 이 중점인 양극 척도이고, 수축 e/(e+5) 가
  // 희소 증거를 0 으로 당기는 것과 같은 규칙의 극한이다. 대시보드의 기존
  // Threat/Response 선도 같은 규약으로 0 을 채운다 — 한쪽만 끊으면 비교가 왜곡된다.
  const out = labels.map(d=>{
    const day = LLM[d];
    if(!day) return null;
    let cells;
    if(domain==='overall'){
      cells = day.cells;
      if(!cells) return null;
    } else {
      const chs = day.channels;
      if(!chs || !Object.keys(chs).length) return null;   // 채널 미계산
      cells = chs[ch] || {};                              // 그 채널에 증거 없음
    }
    const c = cells[key];
    return (c && typeof c.value==='number') ? c.value : 0;
  });
  // 전부 0 이면 그릴 가치가 없다 — 그 칸은 42일 내내 증거가 없었다는 뜻이다.
  return out.some(v=>v!==null && v!==0) ? out : null;
}

function llmLabel(domain){
  const base = curLang==='ko' ? 'LLM 전수코딩' : 'LLM full coding';
  // 공급망 탭에서는 LLM 쪽이 '경제' 채널임을 밝힌다 — 정의가 다르다.
  if(domain==='supply') return base + (curLang==='ko' ? ' (경제 채널)' : ' (economic)');
  return base;
}

function chartOptions(yTitle, labels){
  if(labels) dayLabels = labels;
  return {
    responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    // 마우스를 올리면 아래 패널이 그날로 바뀌고, 떼도 **남는다**. 해설은
    // 읽는 데 몇 초 걸리므로 사라지면 읽을 수가 없다. 터치 기기에서는
    // onClick 이 같은 일을 한다.
    onHover:(e,els)=>{ if(els.length) showDay(dayLabels[els[0].index]); },
    onClick:(e,els)=>{ if(els.length) showDay(dayLabels[els[0].index]); },
    plugins:{
      legend:{labels:{color:'#eef2fa',font:{family:'Courier New',size:9},boxWidth:10,usePointStyle:true}},
      tooltip:{backgroundColor:'#0a1628',borderColor:'#0f2040',borderWidth:1,
        titleColor:'#e2e8f0',bodyColor:'#eef2fa',
        callbacks:{label:c=>c.dataset.label===t('baseline')?'':` ${c.dataset.label}: ${c.parsed.y!==null?(c.parsed.y>=0?'+':'')+c.parsed.y.toFixed(3):'N/A'}`}},
      zoom:{
        pan:{enabled:true,mode:'x',modifierKey:null},
        zoom:{wheel:{enabled:true},pinch:{enabled:true},drag:{enabled:false},mode:'x'},
        limits:{x:{minRange:8}}
      }
    },
    scales:{
      x:{ticks:{color:'#eef2fa',font:{family:'Courier New',size:8},maxTicksLimit:8,maxRotation:45,minRotation:45},
        grid:{color:'#080d1a'},border:{color:'#0f2040'},
        title:{display:true,text:t('dateAxis'),color:'#eef2fa',font:{family:'Courier New',size:8}}},
      y:{ticks:{color:'#eef2fa',font:{family:'Courier New',size:9},callback:v=>(v>=0?'+':'')+v.toFixed(1)},
        grid:{color:'#0f2040'},border:{color:'#0f2040'},
        title:{display:true,text:yTitle,color:'#eef2fa',font:{family:'Courier New',size:9}}}
    }
  };
}

// ── 시간범위 선택 (30d/3m/6m: 일별 누적 daily_history.json / 1y/5y/10y: 주간 kbti_history.json) ──
function renderRangeTabs(){
  const el=document.getElementById('rtabs');
  if(!el)return;
  if(curDomain!=='overall'){
    el.innerHTML=`<span style="font-size:.65rem;color:#5a6a8a">${t('rangeOnlyOverall')}</span>`;
    return;
  }
  let html='';
  RANGE_ORDER.forEach(r=>{
    html+=`<button class="dtab${curRange===r?' active':''}" onclick="setRange('${r}')">${t('rangeLabels')[r]}</button>`;
  });
  html+=`<button class="dtab" style="margin-left:.4rem" onclick="resetChartZoom()">${t('resetZoom')}</button>`;

window.resetChartZoom=function(){
  if(dc && dc.resetZoom) dc.resetZoom();
};

window.setRange=async function(r){
  curRange=r;
  renderRangeTabs();
  if(r in RANGE_DAYS){
    // 30d/3m/6m/1y: 일별 누적 + (그 이전 구간을 메울) 주간 백필, 둘 다 필요
    if(!DAILY) await loadDailyHistory();
    if(!HIST) await loadWeeklyHistory();

// LLM 계열은 **실패해도 조용히 넘어간다.** 그림자 계층이고, 없다고 대시보드가
// 망가지면 안 된다. 날짜 키 -> {cells, channels} 구조를 그대로 쓴다.
async function loadLLM(){
  try{
    const res=await fetch(LLM_URL+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    LLM=await res.json();
  }catch(e){
    LLM=null;
    console.warn('llm_series.json load failed:', e.message);
  }
}

// 날짜별 해설. 아직 생성되지 않았을 수 있으므로 **없어도 조용히 넘어간다** —
// 패널은 그때 "해설 없음"만 띄운다.
async function loadLLMCommentary(){
  try{
    const res=await fetch(LLMCOM_URL+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    LLMCOM=j.days||j;
  }catch(e){
    LLMCOM=null;
    console.warn('llm_commentary.json load failed:', e.message);
  }
}

// 차트 아래 패널에 그날 해설을 띄운다. day 가 null 이면 가장 최근 날짜.
function showDay(day){
  const panel=document.getElementById('daypanel');
  if(!panel) return;
  if(day) pinnedDay=day;
  const d = day || pinnedDay ||
            (dayLabels.length ? dayLabels[dayLabels.length-1] : null);
  if(!d){ panel.hidden=true; return; }
  panel.hidden=false;
  pinnedDay=d;
  document.getElementById('dp-date').textContent=d;

  // 머리줄에 그날 지수 둘을 같이 적는다 — 툴팁이 사라진 뒤에도 남는다.
  const i=dayLabels.indexOf(d);
  let vals='';
  if(dc && i>=0){
    const parts=[];
    dc.data.datasets.forEach(ds=>{
      if(ds.label===t('baseline')) return;
      const v=ds.data[i];
      parts.push(ds.label+': '+(v===null||v===undefined?'N/A':(v>=0?'+':'')+Number(v).toFixed(2)));
    });
    vals=parts.join('   ');
  }
  document.getElementById('dp-vals').textContent=vals;

  const body=document.getElementById('dp-body');
  // 해설은 **날짜 × 상대국**으로 저장돼 있다. 날짜만으로 찾으면 북한 그래프
  // 아래에 중국 해설이 붙는다.
  const rec = LLMCOM && LLMCOM[d] && curPartner ? LLMCOM[d][curPartner] : null;
  const txt = rec && (rec[curLang] || rec.ko || rec.en);
  if(txt){ body.textContent=txt; body.classList.remove('empty'); }
  else{
    body.textContent = curLang==='ko'
      ? '이 날짜의 해설이 아직 없습니다.'
      : 'No commentary for this date yet.';
    body.classList.add('empty');
  }
}

// 오늘 날짜(YYYY-MM-DD)에서 n일 전 날짜 문자열 계산 (사전식 비교로 주간/일별 날짜를 함께 정렬하기 위함)
function daysAgoStr(n){
  const ref = (DATA && DATA.query_date) ? new Date(DATA.query_date) : new Date();
  ref.setDate(ref.getDate() - n);
  return ref.toISOString().slice(0,10);
}

// LLM 전수코딩이 있는 가장 이른 날짜. 없으면 30일 전으로 물러선다.
function llmEarliest(){
  const days = LLM && (LLM.days || LLM);
  const ks = days ? Object.keys(days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort() : [];
  return ks.length ? ks[0] : daysAgoStr(30);
}

// 현재 선택된 기간(curRange)에 맞춰 라벨·Threat·Response 배열을 반환.
// 30d/3m/6m/1y: 우리가 직접 모은 일별 데이터(DAILY)가 있는 구간은 그걸 우선 쓰고,
//               그 일별 데이터가 시작되기 전의 남는 과거 구간만 주간 백필(HIST)로 메운다.
//               -> 시간이 지나 DAILY가 그 기간을 다 채우면, 자동으로 주간 데이터 의존이 0이 됨.
// 5y/10y: 순수 주간 백필만 사용(해상도상 일별로 보여줄 실익이 적음).
function getRangeSeries(p){
  // **truthy 검사를 쓰면 안 된다** — 'llm' 의 값이 0 이라 거짓으로 떨어져
  // 주간 전용 분기로 새고, 전수코딩 구간 버튼이 10년치를 그렸다.
  if(curRange in RANGE_DAYS){
    const cutoff = curRange==='llm' ? llmEarliest()
                 : daysAgoStr(RANGE_DAYS[curRange]);
    const dailyDates = (DAILY && DAILY.dates) || [];
    const weeklyDates = (HIST && HIST.weeks) || [];
    const earliestDaily = dailyDates.length ? dailyDates[0] : null;

    const weeklyPts = weeklyDates.map((d,i)=>({
      date:d,
      th:(HIST.history[p+'_threat']||[])[i], re:(HIST.history[p+'_response']||[])[i]
    })).filter(pt => pt.date >= cutoff && (!earliestDaily || pt.date < earliestDaily));

    const dailyPts = dailyDates.map((d,i)=>({
      date:d,
      th:(DAILY.history[p+'_threat']||[])[i], re:(DAILY.history[p+'_response']||[])[i]
    })).filter(pt => pt.date >= cutoff);

    const merged = weeklyPts.concat(dailyPts).sort((a,b)=>a.date.localeCompare(b.date));
    const usedWeekly = weeklyPts.length > 0;
    return {
      labels: merged.map(m=>m.date),
      threat: merged.map(m=>m.th===null||m.th===undefined?null:parseFloat(m.th)),
      response: merged.map(m=>m.re===null||m.re===undefined?null:parseFloat(m.re)),
      note: usedWeekly ? (t('rangeNoteMerged')||t('rangeNoteDaily')) : t('rangeNoteDaily')
    };
  } else {
    const src=HIST||{weeks:[],history:{}};
    const n=RANGE_WEEKS_ONLY[curRange];
    const labels=(src.weeks||[]).slice(-n);
    const th=(src.history[p+'_threat']||[]).slice(-n).map(v=>v===null?null:parseFloat(v));
    const re=(src.history[p+'_response']||[]).slice(-n).map(v=>v===null?null:parseFloat(v));
    return {labels, threat:th, response:re, note:t('rangeNoteWeekly')};
  }
}

// 정적(고정 위치) 텍스트 요소들을 현재 언어로 갱신
function applyStaticText(){
  document.getElementById('hdr-title').textContent=t('title');
  document.getElementById('leg-low').textContent=t('legend').low;
  document.getElementById('leg-mod').textContent=t('legend').mod;
  document.getElementById('leg-elev').textContent=t('legend').elev;
  document.getElementById('leg-high').textContent=t('legend').high;
  document.getElementById('leg-crit').textContent=t('legend').crit;
  document.getElementById('detBackBtn').textContent=t('backToList');
  document.getElementById('foot').innerHTML=t('footer');
  renderRangeTabs();
  const langKr=document.getElementById('lang-kr'), langEn=document.getElementById('lang-en');
  langKr.style.color=curLang==='ko'?'#38bdf8':'#eef2fa';
  langEn.style.color=curLang==='en'?'#38bdf8':'#eef2fa';
}

window.toggleLang=function(){
  curLang = curLang==='ko' ? 'en' : 'ko';
  document.documentElement.classList.toggle('lang-en', curLang==='en');
  applyStaticText();
  if(DATA){
    const mc=document.getElementById('main-content');
    mc.innerHTML='<div class="cols"><div class="col-main">'
      +renderOverall()+'<div id="grid-section"></div></div>'
      +'<div class="col-side">'+renderCommentary()+'</div></div>'
      +`<div class="methodology">${t('methodology')}</div>`;
    renderGrid();
  }
  if(ak) renderDetailChart(ak);
};

// 데이터 로드
async function loadData(){
  try{
    const res=await fetch(DATA_URL+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    DATA=await res.json();
    // generated_at은 파이썬 datetime.now().isoformat() (타임존 표기 없는 UTC) ->
    // 브라우저가 이걸 로컬시간으로 오인하지 않도록 'Z'를 붙여 명시적으로 UTC로 파싱한 뒤,
    // 헷갈리기 쉬운 UTC/KST 혼동을 원천 방지하기 위해 한국시간(KST, UTC+9)으로 변환해 표시.
    let genAtLabel=DATA.query_date||'';
    if(DATA.generated_at){
      const utc=new Date(DATA.generated_at+'Z');
      if(!isNaN(utc.getTime())){
        const kst=new Date(utc.getTime()+9*60*60*1000);
        const pad=n=>String(n).padStart(2,'0');
        genAtLabel=`${kst.getUTCFullYear()}-${pad(kst.getUTCMonth()+1)}-${pad(kst.getUTCDate())} ${pad(kst.getUTCHours())}:${pad(kst.getUTCMinutes())} KST`;
      }
    }
    document.getElementById('updated-time').textContent=`Updated: ${genAtLabel} · ${DATA.total_rows||0} events`;
    const mc=document.getElementById('main-content');
    mc.innerHTML='<div class="cols"><div class="col-main">'
      +renderOverall()+'<div id="grid-section"></div></div>'
      +'<div class="col-side">'+renderCommentary()+'</div></div>'
      +`<div class="methodology">${t('methodology')}</div>`;
    renderGrid();
  }catch(e){
    document.getElementById('main-content').innerHTML=
      `<div class="error">${t('loadFailData')}: ${e.message}<br><small>${DATA_URL}</small></div>`;
  }
}
applyStaticText();
loadData();
// LLM 계열은 나중에 도착할 수 있다. 도착하면 열려 있는 상세 차트만 다시 그린다.
// 지수와 해설을 함께 받는다. 해설은 실패해도 그래프에 영향이 없다.
Promise.all([loadLLM(), loadLLMCommentary()]).then(()=>{
  if(typeof ak!=='undefined' && ak) renderDetailChart(ak);
});

// 30분마다 자동 새로고침
setInterval(loadData, 30*60*1000);
</script>

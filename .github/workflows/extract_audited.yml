name: 운영 감사값 추출 (수동)

# git 이력에서 '그날 감사된 값'을 전부 긁어낸다.
#
# 왜 필요한가: 파이프라인은 계열을 매 회차 BigQuery에서 전부 다시 만들고,
# 감사 결과는 series[-1] 한 칸에만 쓴다. 다음 회차가 돌면 어제 칸은 감사 없이
# 재계산되어 원래 값으로 돌아간다. 따라서 '그날 감사된 값'은 그날 커밋된
# kbti_output.json 안에만 남아 있다. 여기서 커밋을 하나씩 열어 모은다.
#
# 읽기만 한다. 저장소를 바꾸지 않는다. BigQuery도 LLM도 쓰지 않으므로 비용 0.

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃 (전체 이력)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 이력 전체가 필요하다. 얕게 받으면 커밋이 안 보인다.

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 추출
        run: |
          python3 - <<'PY'
          import json, subprocess, os

          FILE, OUT = "kbti_output.json", "operational_audited.json"

          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True, check=True).stdout

          log = sh("git", "log", "--format=%H\t%cI", "--", FILE).strip().splitlines()
          print(f"{FILE} 을 바꾼 커밋 {len(log)}개")

          per_date, runs, skipped = {}, [], 0
          for i, line in enumerate(reversed(log), 1):        # 오래된 것부터
              sha, when = line.split("\t")
              try:
                  o = json.loads(sh("git", "show", f"{sha}:{FILE}"))
              except Exception:
                  skipped += 1; continue
              dates = o.get("full_dates") or o.get("dates") or []
              if not dates:
                  skipped += 1; continue
              day = dates[-1]
              audit = (o.get("stats") or {}).get("audit") or {}
              vals = {}
              for dom, blk in (o.get("domains") or {}).items():
                  for field, arr in ((blk or {}).get("series") or {}).items():
                      if isinstance(arr, list) and len(arr) == len(dates):
                          vals[f"{dom}|{field}"] = arr[-1]
              rec = {"date": day, "sha": sha, "committed_at": when,
                     "generated_at": o.get("generated_at"), "query_date": o.get("query_date"),
                     "audit_enabled": bool(audit.get("enabled")),
                     "date_audited": audit.get("date_audited"),
                     "checked": audit.get("checked"), "flagged": audit.get("flagged"),
                     "corrections_applied": audit.get("corrections_applied"),
                     "values": vals}
              runs.append(rec)
              per_date[day] = rec                            # 뒤에 오는 것이 이김 = 그날 마지막
              if i % 25 == 0:
                  print(f"  {i}/{len(log)} …")

          enabled = sorted(r["date"] for r in runs if r["audit_enabled"])
          out = {"generated_by": "extract_audited.yml", "file": FILE,
                 "commits_seen": len(log), "commits_parsed": len(runs),
                 "commits_skipped": skipped,
                 "audit_first_enabled_date": enabled[0] if enabled else None,
                 "dates": sorted(per_date), "last_run_per_date": per_date,
                 "all_runs": runs}
          with open(OUT, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)

          print(f"\n저장: {OUT}")
          print(f"  날짜 {len(per_date)}개  회차 {len(runs)}개  건너뜀 {skipped}")
          print(f"  감사가 켜진 가장 이른 날짜: {out['audit_first_enabled_date']}")
          if per_date:
              d = sorted(per_date)[-1]; r = per_date[d]
              print(f"  예시 ({d}): checked={r['checked']} flagged={r['flagged']} "
                    f"diplomatic|PRK_threat={r['values'].get('diplomatic|PRK_threat')}")
          PY

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-audited
          path: operational_audited.json
          if-no-files-found: warn

name: 통신사 수집 여부 확인 (수동)

# GDELT 가 연합·로이터 등을 아예 안 긁는 것인지, 긁는데 우리 행위자 필터에
# 안 걸리는 것인지 가린다. **읽기 전용 — 저장소에 쓰지 않고 LLM 호출 0건.**

on:
  workflow_dispatch:
    inputs:
      run:
        description: '1이면 실제 조회, 비워 두면 처리량만 확인'
        required: false
        default: ''
      days:
        description: '며칠치를 볼지 (기본 3). GKG 는 크므로 작게 시작할 것'
        required: false
        default: '3'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성
        run: pip install --quiet google-cloud-bigquery

      - name: GCP 인증
        run: |
          echo '${{ secrets.GCP_KEY }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: 확인
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          RUN: ${{ inputs.run }}
          SOURCE_DAYS: ${{ inputs.days }}
        run: python check_sources.py

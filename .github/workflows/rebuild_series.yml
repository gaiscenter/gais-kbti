name: KBTI 계열 재집계 (수동)

# llm_coded/ 를 다시 집계해 llm_series.json 을 새로 쓴다.
# **LLM 호출 0건, BigQuery 0건 — 비용 0. API 키도 필요 없다.**
#
# 왜: 2026-11-19 에 집계 규칙이 바뀌었다 — 협력적 상호행위(CAMEO 040·050·060)를
# 양방향에 기록한다. 기사 코딩(llm_coded/)은 그대로 쓸 수 있고 바뀐 것은 집계뿐이라
# 기사를 다시 읽을 이유가 없다. 코드북 지문도 V1~V5 판정도 그대로이므로 맹검
# 코더와의 일치도(kappa)는 유효하다.
#
# 먼저 DRY_RUN 으로 무엇이 바뀌는지 보고, 그 다음 실제로 쓰는 것을 권한다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 바뀌는 것만 보고 파일을 쓰지 않음'
        required: false
        default: '1'

concurrency:
  group: kbti-repo-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 재집계
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: python rebuild_series.py

      - name: 결과 커밋
        if: inputs.dry_run != '1'
        run: |
          git config user.name "GAIS Bot"
          git config user.email "bot@gaiscenter.org"
          git add llm_series.json
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "계열 재집계 — 협력적 상호행위 양방향 기록"
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push 실패 ($i/3) — 10초 뒤 재시도"; sleep 10
          done
          echo "::error::push 에 실패했습니다"; exit 1

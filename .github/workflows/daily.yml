name: KBTI Daily Update

on:
  workflow_dispatch:
  schedule:
    # 3시간마다 실행 (하루 8회). 예전엔 하루 1번(자정 직후)만 돌아서, 낮에 발생한 사건이
    # 최대 24시간 뒤에야 반영되는 문제가 있었음 — 조기경보 목적상 이 지연은 너무 김.
    # BigQuery 처리량은 매 실행 1~2GB 수준이라, 8배 늘려도 월 무료한도(1TB)에 여유 있음.
    - cron: '1 */3 * * *'

# 수동으로 여러 번 연달아 눌러도 동시에 병렬 실행되지 않고 순서대로 하나씩 기다리도록 함.
# (동시 실행 시 git 커밋 경쟁으로 raw_data 등의 파일이 유실될 수 있는 문제를 방지)
concurrency:
  group: kbti-daily-update
  cancel-in-progress: false

jobs:
  update-kbti:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: GCP 인증
        run: |
          echo '${{ secrets.GCP_KEY }}' > /tmp/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: KBTI 파이프라인 실행
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py

      - name: 결과 커밋
        run: |
          git config user.name "GAIS Bot"
          git config user.email "bot@gaiscenter.org"
          git add kbti_output.json
          if [ -f audit_log.json ]; then git add audit_log.json; fi
          if [ -f daily_history.json ]; then git add daily_history.json; fi
          if [ -d raw_data ]; then git add raw_data/; fi
          git diff --cached --quiet || git commit -m "KBTI update $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push

name: KBTI 시험세트 재코딩

# 수동 전용. 180건이라 토큰·시간이 거의 들지 않는다(약 2M, 1분).
#
# 논문의 신뢰도(kappa)는 v1.1 시점 봉인본으로 계산한 값이다. 그 뒤 코드북이
# v1.2(세부코드 삭제)·v1.3(경제 행위 포함)으로 두 번 바뀌었고 재측정하지 않았다.
# 지금 배포 중인 코더의 신뢰도를 아무도 모르는 상태다.
#
# **봉인본 testset_llm_tags.json 은 덮지 않는다.** 판본 간 비교가 결과이므로
# 옛 값이 남아 있어야 한다. 코드북 판본마다 **다른 파일**에 쓴다 —
# 같은 파일에 쓰면 κ 비교표의 지난 판본 열이 사라진다.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: '동시 호출 수'
        required: true
        default: '6'
      out:
        description: '비우면 코드북 판본에서 자동으로 정한다(권장). 손으로 적으면 지난 판본을 덮어쓸 수 있다'
        required: true
        default: ''

concurrency:
  group: kbti-repo-write
  cancel-in-progress: false

jobs:
  recode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 시험세트 재코딩
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODE_WORKERS: ${{ inputs.workers }}
          TESTSET_OUT: ${{ inputs.out }}
        run: python recode_testset.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "GAIS Bot"
          git config user.email "bot@gaiscenter.org"
          # 파일마다 **따로** 올린다. 여러 경로를 한 번에 주면 그중 하나가 없을 때
          # git add 가 통째로 실패한다. 2026-10-27 에 testset_v1_changed.json 이
          # 없어서 재코딩 결과가 하나도 커밋되지 않았다.
          # 출력 파일명은 비워 두면 스크립트가 코드북 판본에서 정한다. 그러면
          # inputs.out 이 비어 PRESERVE_PATHS 에서 빠지고, commit_outputs.py 의
          # reset 이 방금 만든 파일을 지운다 — 2026-10-27 사고와 같은 경로다.
          # 그래서 **실제로 생긴 파일을 글롭으로 찾는다.** 손으로 적은 이름에
          # 의존하지 않는다.
          FILES=$(ls -1 testset_llm_tags_v*.json 2>/dev/null | grep -v '^testset_llm_tags\.json$' || true)
          FILES="$FILES testset_v1_changed.json llm_coder_cache.json"
          STAGED=""
          # 파일마다 **따로** 올린다. 여러 경로를 한 번에 주면 그중 하나가 없을 때
          # git add 가 통째로 실패한다. 2026-10-27 에 testset_v1_changed.json 이
          # 없어서 재코딩 결과가 하나도 커밋되지 않았다.
          for f in $FILES; do
            if [ -f "$f" ]; then git add "$f"; STAGED="$STAGED $f"; echo "staged: $f"
            else echo "없음(건너뜀): $f"; fi
          done
          git diff --cached --quiet && { echo "::error::올릴 파일이 하나도 없습니다"; exit 1; }
          # **봉인본은 절대 올리지 않는다.** 글롭이 잡으면 판본 비교가 무너진다.
          git diff --cached --name-only | grep -qx 'testset_llm_tags.json' \
            && { echo "::error::봉인본 testset_llm_tags.json 이 스테이징됐습니다"; exit 1; }
          VER=$(head -1 codebook.md | sed -n 's/.*v\([0-9]*\)\.\([0-9]*\).*/v\1.\2/p')
          echo "코드북 판본: ${VER:-미확인} · 지킬 경로:$STAGED"
          PRESERVE_PATHS="$STAGED" \
            COMMIT_MSG="시험세트 재코딩 (${VER:-코드북 판본 미확인})" python commit_outputs.py
